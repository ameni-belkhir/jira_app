<div class="relative p-6 bg-white z-1 dark:bg-gray-900 sm:p-0">
  <div
    class="relative flex flex-col justify-center w-full h-screen lg:flex-row dark:bg-gray-900 sm:p-0"
  >
    <ng-content></ng-content>
    <div
      class="items-center hidden w-full h-full lg:w-1/2 bg-brand-950 dark:bg-white/5 lg:grid relative"
    >
      <div class="flex items-center justify-center z-1">
        <!-- ===== Common Grid Shape Start ===== -->
        <app-grid-shape />
        <div class="flex flex-col items-center">
          <a [routerLink]="logoTarget" class="flex flex-col items-center gap-3 mb-6">
            <svg width="44" height="44" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="hover:scale-105 transition-transform duration-200 cursor-pointer">
              <rect x="6" y="6" width="22" height="22" rx="6" fill="#3B82F6" fill-opacity="0.5"/>
              <rect x="12" y="12" width="22" height="22" rx="6" fill="#6366F1"/>
              <rect x="16" y="17" width="14" height="2.5" rx="1.25" fill="white"/>
              <rect x="16" y="22" width="10" height="2.5" rx="1.25" fill="white" fill-opacity="0.7"/>
              <circle cx="18" cy="28" r="1.5" fill="#38BDF8"/>
            </svg>
            <span class="text-xl font-bold tracking-tight text-white">
              Jira App
            </span>
          </a>

          <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full max-w-lg mx-auto filter drop-shadow-2xl">
            <circle cx="250" cy="250" r="180" fill="#6366F1" fill-opacity="0.15" />
            <rect x="80" y="100" width="280" height="200" rx="16" fill="#3B82F6" fill-opacity="0.4" transform="rotate(-6 220 200)" />
            <rect x="120" y="140" width="290" height="220" rx="20" fill="#1E293B" stroke="#6366F1" stroke-width="2" />
            <rect x="150" y="170" width="80" height="12" rx="6" fill="#38BDF8" />
            <circle cx="370" cy="176" r="10" fill="#6366F1" />
            <rect x="150" y="200" width="230" height="40" rx="10" fill="#334155" />
            <rect x="165" y="215" width="100" height="10" rx="5" fill="white" fill-opacity="0.9" />
            <circle cx="360" cy="220" r="6" fill="#10B981" />
            <rect x="150" y="250" width="230" height="40" rx="10" fill="#334155" />
            <rect x="165" y="265" width="140" height="10" rx="5" fill="white" fill-opacity="0.9" />
            <circle cx="360" cy="270" r="6" fill="#F59E0B" />
            <g transform="translate(260, 310)">
              <rect width="160" height="50" rx="12" fill="#10B981" />
              <path d="M25 25L32 32L45 18" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="55" y="30" fill="white" font-weight="bold" font-size="13">Tâche terminée !</text>
            </g>
          </svg>
        </div>
      </div>
    </div>
    <div class="fixed z-50 hidden bottom-6 right-6 sm:block">
      <app-theme-toggle-two />
    </div>
  </div>
</div>
