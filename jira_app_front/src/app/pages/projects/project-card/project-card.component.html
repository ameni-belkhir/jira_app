@let p = project;
<a
  [routerLink]="['/projects', p.id, 'backlog']"
  class="block group bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 p-5 shadow-theme-sm hover:shadow-theme-lg transition-all duration-300 hover:-translate-y-1 cursor-pointer"
>
  <div class="flex items-start justify-between mb-4">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white group-hover:text-brand-500 transition-colors">
        {{ p.nom }}
      </h3>
      @if (p.description) {
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">
          {{ p.description }}
        </p>
      }
    </div>
  </div>

  <!-- Responsable -->
  @if (p.responsable) {
    <div class="flex items-center gap-2 mb-4">
      <svg class="w-4 h-4 text-gray-400 shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
      </svg>
      <span class="text-sm text-gray-500 dark:text-gray-400">{{ p.responsable }}</span>
    </div>
  }

  <!-- Member count -->
  <div class="pt-3 border-t border-gray-100 dark:border-gray-800 flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
    <svg class="w-4 h-4 shrink-0" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
    </svg>
    <span>{{ p.memberIds.length }} member(s)</span>
  </div>
</a>
