@let p = project;
<div
  [routerLink]="['/projects', p.id, 'backlog']"
  class="block group bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 p-5 shadow-theme-sm hover:shadow-theme-lg transition-all duration-300 hover:-translate-y-1 cursor-pointer"
>
  <div class="flex items-start justify-between mb-4">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white group-hover:text-brand-500 transition-colors">
        {{ p.nom }}
      </h3>
      @if (p.description) {
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">
          {{ p.description }}
        </p>
      }
    </div>
    @if (canManageProjects) {
      <div class="shrink-0 flex items-center gap-1">
        <button
          (click)="onEditClick($event)"
          title="Modifier le projet"
          class="p-2 rounded-lg text-gray-400 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-colors"
        >
          <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
            <path d="M2.695 14.762a1 1 0 00-.047 1.414l1.414 1.414a1 1 0 001.414-.047L17.034 3.034a2 2 0 00-2.828-2.828L2.695 14.762z" />
            <path fill-rule="evenodd" d="M16 2a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V4a2 2 0 012-2h12zm0 1.5H4a.5.5 0 00-.5.5v12a.5.5 0 00.5.5h12a.5.5 0 00.5-.5V4a.5.5 0 00-.5-.5z" clip-rule="evenodd" />
          </svg>
        </button>
        <button
          (click)="onDeleteClick($event)"
          title="Supprimer le projet"
          [disabled]="deleting"
          class="p-2 rounded-lg text-gray-400 hover:text-error-500 hover:bg-error-50 dark:hover:bg-error-500/10 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (deleting) {
            <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
            </svg>
          } @else {
            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
          }
        </button>
      </div>
    }
  </div>

  <!-- Responsable -->
  @if (p.responsable) {
    <div class="flex items-center gap-2 mb-4">
      <svg class="w-4 h-4 text-gray-400 shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
      </svg>
      <span class="text-sm text-gray-500 dark:text-gray-400">{{ p.responsable }}</span>
    </div>
  }

  <!-- Member count -->
  <div class="pt-3 border-t border-gray-100 dark:border-gray-800 flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
    <svg class="w-4 h-4 shrink-0" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
    </svg>
    <span>{{ p.members.length }} member(s)</span>
  </div>
</div>
